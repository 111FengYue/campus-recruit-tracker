<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校招记录</title>
<meta name="theme-color" content="#3b6ef5">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="校招记录">
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --border: #e6e8ec;
    --text: #1f2329;
    --muted: #8a919c;
    --accent: #3b6ef5;
    --accent-soft: #eef3ff;
    --danger: #e5484d;
    --danger-soft: #fdecec;
    --hover: #eef0f3;
    --panel-bg: #fafbfc;
    --divider: #f0f1f3;
    --badge-bg: #eef0f3;
    --faint: #b3b9c2;
    --ok: #16a34a;
    --mask: rgba(15, 23, 42, .4);
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
    --radius: 12px;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #0f1216;
    --card: #1a1e24;
    --border: #2a3038;
    --text: #e8eaed;
    --muted: #98a0ab;
    --accent: #6b9bff;
    --accent-soft: #223151;
    --danger: #ff6b6f;
    --danger-soft: #3a2225;
    --hover: #242a32;
    --panel-bg: #15191f;
    --divider: #252b33;
    --badge-bg: #262d36;
    --faint: #6b7380;
    --ok: #34d399;
    --mask: rgba(0, 0, 0, .65);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 1px 3px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }

  /* 顶部 */
  header { margin-bottom: 24px; }
  .header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header h1 { font-size: 24px; font-weight: 650; letter-spacing: .5px; }
  .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ghost-btn {
    height: 30px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text); font-size: 12px; cursor: pointer;
    transition: background .12s, border .12s;
  }
  .ghost-btn:hover { background: var(--hover); }
  header .sub {
    margin-top: 6px; font-size: 13px; color: var(--muted);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .stat { font-size: 12px; color: var(--muted); }
  .stat b { color: var(--text); font-weight: 600; }
  .dot-sep { color: var(--muted); }
  .sync-status { margin-left: auto; font-size: 12px; color: var(--muted); }
  .sync-status.ok { color: var(--ok); }
  .sync-status.syncing { color: var(--accent); }
  .sync-status.error { color: var(--danger); }

  /* 表单 */
  .form-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px; margin-bottom: 28px;
  }
  .form-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr auto auto; gap: 10px; align-items: end;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .field input {
    height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; color: var(--text); background: var(--card); outline: none; transition: border .15s, box-shadow .15s;
  }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn {
    height: 38px; padding: 0 18px; border: none; border-radius: 8px; cursor: pointer;
    font-size: 14px; font-weight: 600; background: var(--accent); color: #fff;
    transition: filter .15s, transform .05s; white-space: nowrap;
  }
  .btn:hover { filter: brightness(.92); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }

  /* 分组 */
  .group { margin-bottom: 22px; }
  .group-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .group-title { font-size: 15px; font-weight: 650; }
  .group-count {
    font-size: 12px; color: var(--muted); background: var(--badge-bg); border-radius: 20px;
    padding: 2px 10px; font-weight: 500;
  }
  .group.rejected-group .group-title { color: var(--danger); }

  /* 卡片 */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 8px; overflow: hidden; transition: border .15s;
  }
  .card-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }

  .reject-toggle {
    display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; flex-shrink: 0;
    font-size: 12px; color: var(--muted);
  }
  .reject-toggle input { width: 16px; height: 16px; accent-color: var(--danger); cursor: pointer; }

  .card-main { flex: 1; min-width: 0; cursor: pointer; }
  .card-title {
    font-size: 15px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  }
  .company { color: var(--text); }
  .pos-sep { color: var(--muted); font-weight: 400; }
  .position { color: var(--muted); font-weight: 500; }
  .card-meta { margin-top: 3px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .tag {
    font-size: 11px; padding: 1px 8px; border-radius: 20px; background: var(--accent-soft);
    color: var(--accent); font-weight: 600;
  }
  .hint-learn { font-size: 11px; color: var(--faint); }

  .card-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .progress-select {
    height: 30px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px;
    color: var(--text); background: var(--card); padding: 0 6px; outline: none; cursor: pointer; max-width: 110px;
  }
  .progress-select:focus { border-color: var(--accent); }
  .icon-btn {
    width: 30px; height: 30px; border: none; border-radius: 8px; cursor: pointer;
    background: transparent; color: var(--muted); font-size: 16px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center; transition: background .12s, color .12s;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn.del:hover { background: var(--danger-soft); color: var(--danger); }

  /* 落选划掉 */
  .card.rejected { opacity: .62; }
  .card.rejected .card-title,
  .card.rejected .card-meta,
  .card.rejected .company,
  .card.rejected .position { text-decoration: line-through; }

  /* 知识点面板 */
  .knowledge-panel { border-top: 1px dashed var(--border); padding: 12px 14px 14px; background: var(--panel-bg); }
  .kp-head { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
  .kp-list { list-style: none; margin-bottom: 12px; }
  .kp-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--divider); }
  .kp-item:last-child { border-bottom: none; }
  .kp-item input[type=checkbox] { width: 15px; height: 15px; accent-color: #16a34a; cursor: pointer; flex-shrink: 0; }
  .kp-text { flex: 1; font-size: 14px; }
  .kp-item.done .kp-text { text-decoration: line-through; color: var(--muted); }
  .kp-del { border: none; background: transparent; color: var(--faint); cursor: pointer; font-size: 16px; padding: 0 4px; }
  .kp-del:hover { color: var(--danger); }
  .kp-add { display: flex; gap: 8px; }
  .kp-add input {
    flex: 1; height: 34px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; color: var(--text); background: var(--card); outline: none;
  }
  .kp-add input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn-sm { height: 34px; padding: 0 14px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-sm:hover { filter: brightness(.92); }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 60px 0; }

  /* 登录页 */
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 32px; width: 100%; max-width: 360px;
  }
  .auth-card h1 { font-size: 22px; font-weight: 650; margin-bottom: 4px; }
  .auth-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .auth-card .field { margin-bottom: 14px; }
  .auth-card .btn { width: 100%; height: 40px; margin-top: 4px; }
  .auth-switch { text-align: center; font-size: 13px; color: var(--muted); margin-top: 16px; }
  .auth-switch a { color: var(--accent); cursor: pointer; text-decoration: none; font-weight: 600; }
  .auth-msg { font-size: 13px; color: var(--danger); margin-top: 12px; min-height: 18px; text-align: center; }
  .auth-msg.ok { color: var(--ok); }
  .auth-links { text-align: right; margin-top: 10px; }
  .auth-links a { color: var(--accent); font-size: 12px; cursor: pointer; text-decoration: none; }

  /* 编辑弹窗 */
  .modal-mask {
    position: fixed; inset: 0; background: var(--mask); display: flex; align-items: center; justify-content: center;
    z-index: 50; padding: 20px;
  }
  .modal {
    background: var(--card); border-radius: var(--radius); padding: 20px; width: 100%; max-width: 380px;
    box-shadow: 0 12px 40px rgba(16, 24, 40, .2);
  }
  .modal h3 { font-size: 16px; margin-bottom: 16px; }
  .modal .field { margin-bottom: 12px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .btn-ghost { height: 36px; padding: 0 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font-size: 14px; cursor: pointer; }
  .btn-ghost:hover { background: var(--hover); }

  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr 1fr; }
    .form-grid .btn { grid-column: span 2; }
    .card-actions { gap: 4px; }
    .progress-select { max-width: 88px; }
  }
</style>
</head>
<body>
<div id="app-view" hidden>
  <div class="wrap">
    <header>
      <div class="header-top">
        <h1>校招记录</h1>
        <div class="header-actions">
          <button class="ghost-btn" id="btn-export" title="导出为 JSON 文件">导出</button>
          <button class="ghost-btn" id="btn-import" title="从 JSON 文件导入">导入</button>
          <button class="ghost-btn" id="btn-refresh" title="手动刷新同步">刷新</button>
          <button class="icon-btn" id="btn-theme" title="切换深浅色模式">🌙</button>
          <button class="ghost-btn" id="btn-logout" title="退出登录">退出</button>
        </div>
      </div>
      <div class="sub">
        <span class="stat">共 <b id="stat-total">0</b> 个岗位</span>
        <span class="dot-sep">·</span>
        <span class="stat">进行中 <b id="stat-active">0</b></span>
        <span class="dot-sep">·</span>
        <span class="stat">已划掉 <b id="stat-rejected">0</b></span>
        <span class="sync-status" id="sync-status">已同步</span>
      </div>
    </header>

    <div class="form-card">
      <form id="add-form" class="form-grid" autocomplete="off">
        <div class="field">
          <label for="f-company">公司名称</label>
          <input id="f-company" placeholder="如：字节跳动" required>
        </div>
        <div class="field">
          <label for="f-position">岗位名称</label>
          <input id="f-position" placeholder="如：前端开发工程师" required>
        </div>
        <div class="field">
          <label for="f-progress">当前进展</label>
          <input id="f-progress" list="progress-options" placeholder="如：面试中" value="已投递">
          <datalist id="progress-options"></datalist>
        </div>
        <div class="field">
          <label for="f-date">日期</label>
          <input id="f-date" type="date">
        </div>
        <button type="submit" class="btn">添加</button>
      </form>
    </div>

    <main id="list"></main>
    <div class="empty" id="empty" hidden>还没有记录，先在上方添加第一个岗位吧。</div>
  </div>
</div>

<!-- 登录页 -->
<div id="auth-view" hidden>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>校招记录</h1>
      <p class="auth-sub">登录后，手机与电脑数据自动同步</p>

      <form id="auth-form" autocomplete="on">
        <div class="field">
          <label for="a-email">邮箱</label>
          <input id="a-email" type="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="a-password">密码</label>
          <input id="a-password" type="password" placeholder="至少 6 位" minlength="6" required>
        </div>
        <button type="submit" class="btn" id="a-submit">登录</button>
        <div class="auth-links"><a id="a-forgot">忘记密码？</a></div>
      </form>

      <form id="forgot-form" autocomplete="off" hidden>
        <p class="auth-sub">输入注册邮箱，我们会发送重置链接</p>
        <div class="field">
          <label for="f-email">邮箱</label>
          <input id="f-email" type="email" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="btn">发送重置邮件</button>
        <div class="auth-links"><a id="forgot-back">返回登录</a></div>
      </form>

      <form id="reset-form" autocomplete="off" hidden>
        <p class="auth-sub">设置新密码</p>
        <div class="field">
          <label for="r-password">新密码</label>
          <input id="r-password" type="password" placeholder="至少 6 位" minlength="6" required>
        </div>
        <div class="field">
          <label for="r-password2">确认新密码</label>
          <input id="r-password2" type="password" placeholder="再输入一次" minlength="6" required>
        </div>
        <button type="submit" class="btn">重置密码</button>
      </form>

      <div class="auth-switch" id="auth-switch">
        <span id="a-mode-text">还没有账号？</span>
        <a id="a-toggle">去注册</a>
      </div>
      <p class="auth-msg" id="a-msg"></p>
    </div>
  </div>
</div>

<!-- 导入文件 -->
<input type="file" id="file-import" accept="application/json,.json" hidden>

<!-- 编辑弹窗 -->
<div class="modal-mask" id="modal" hidden>
  <div class="modal">
    <h3>编辑岗位</h3>
    <div class="field">
      <label for="e-company">公司名称</label>
      <input id="e-company">
    </div>
    <div class="field">
      <label for="e-position">岗位名称</label>
      <input id="e-position">
    </div>
    <div class="field">
      <label for="e-date">日期</label>
      <input id="e-date" type="date">
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="modal-cancel">取消</button>
      <button class="btn" id="modal-save">保存</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  // ===== 在这里填入 Supabase 连接信息 =====
  const SUPABASE_URL = "https://vjtqrukclxffusyglkbo.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_BebuzRABdtBdmighCQ88Tg_SnOfShX3";
  // =======================================

  const THEME_KEY = 'campus_recruit_theme';
  const DEFAULT_PROGRESS = ['已投递', '简历筛选', '笔试', '一面', '二面', '三面', 'HR面', 'Offer', '已签约'];
  const PROGRESS_PRIORITY = {
    '已投递': 0, '投递': 0,
    '简历筛选': 1, '筛选中': 1, '简历筛选中': 1,
    '笔试': 2, '笔试中': 2,
    '一面': 3, '面试': 3, '面试中': 3,
    '二面': 4, '三面': 5, 'HR面': 6, 'HR面试': 6,
    'Offer': 7, 'offer': 7, '已通过': 7,
    '已签约': 8
  };

  let supabase = null;
  let records = [];
  let currentUserId = null;
  let authMode = 'login';
  let editingId = null;
  let expandedId = null;

  const $ = (sel) => document.querySelector(sel);

  // ---------- 工具 ----------
  function todayStr() {
    const d = new Date();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }
  function fmtDate(s) {
    if (!s) return '';
    const [y, m, d] = String(s).split('-');
    const cur = new Date().getFullYear();
    return (Number(y) === cur ? '' : y + '年') + Number(m) + '月' + Number(d) + '日';
  }
  function sig(r) {
    return [r.company || '', r.position || '', r.date || '', r.progress || ''].join('||');
  }
  function normalize(row) {
    return {
      id: row.id,
      date: row.date || '',
      company: row.company || '',
      position: row.position || '',
      progress: row.progress || '已投递',
      rejected: !!row.rejected,
      knowledge: Array.isArray(row.knowledge) ? row.knowledge : [],
      knowledgeDone: Array.isArray(row.knowledge_done) ? row.knowledge_done : []
    };
  }

  function setSync(state) {
    const el = $('#sync-status');
    if (!el) return;
    if (state === 'syncing') { el.textContent = '同步中…'; el.className = 'sync-status syncing'; }
    else if (state === 'error') { el.textContent = '同步失败'; el.className = 'sync-status error'; }
    else { el.textContent = '已同步'; el.className = 'sync-status ok'; }
  }

  // ---------- 深浅色 ----------
  function currentTheme() {
    try {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === 'dark' || saved === 'light') return saved;
    } catch (e) {}
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    const btn = $('#btn-theme');
    if (btn) btn.textContent = t === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }

  // ---------- 认证 ----------
  function showAuthPanel(panel) {
    $('#auth-form').hidden = panel !== 'auth';
    $('#forgot-form').hidden = panel !== 'forgot';
    $('#reset-form').hidden = panel !== 'reset';
    $('#auth-switch').hidden = panel !== 'auth';
  }
  function showAuth() {
    currentUserId = null;
    records = [];
    $('#app-view').hidden = true;
    $('#auth-view').hidden = false;
    showAuthPanel('auth');
  }
  async function enterApp() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { showAuth(); return; }
    currentUserId = session.user.id;
    $('#auth-view').hidden = true;
    $('#app-view').hidden = false;
    await loadRecords();
  }
  function setAuthMsg(text, ok) {
    const el = $('#a-msg');
    el.textContent = text;
    el.className = 'auth-msg' + (ok ? ' ok' : '');
  }

  // ---------- 数据读写 ----------
  async function loadRecords() {
    setSync('syncing');
    const { data, error } = await supabase.from('records').select('*').order('created_at', { ascending: true });
    if (error) { setSync('error'); alert('加载失败：' + error.message); return; }
    records = (data || []).map(normalize);
    setSync('ok');
    render();
  }
  async function insertRecord(payload) {
    setSync('syncing');
    const { data, error } = await supabase.from('records').insert(payload).select().single();
    if (error) { setSync('error'); alert('添加失败：' + error.message); return null; }
    setSync('ok');
    return normalize(data);
  }
  async function updateRecord(id, patch) {
    setSync('syncing');
    const { error } = await supabase.from('records').update(patch).eq('id', id);
    if (error) { setSync('error'); alert('保存失败：' + error.message); return false; }
    const rec = records.find(x => x.id === id);
    if (rec) Object.assign(rec, patch);
    setSync('ok');
    render();
    return true;
  }
  async function deleteRecord(id) {
    setSync('syncing');
    const { error } = await supabase.from('records').delete().eq('id', id);
    if (error) { setSync('error'); alert('删除失败：' + error.message); return false; }
    records = records.filter(x => x.id !== id);
    setSync('ok');
    render();
    return true;
  }

  // ---------- 导出 / 导入 ----------
  function exportJSON() {
    const data = records.map(r => ({
      date: r.date, company: r.company, position: r.position,
      progress: r.progress, rejected: r.rejected,
      knowledge: r.knowledge, knowledgeDone: r.knowledgeDone
    }));
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '校招记录-' + todayStr() + '.json';
    a.click();
    URL.revokeObjectURL(url);
  }
  function importJSON(file) {
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const arr = JSON.parse(reader.result);
        if (!Array.isArray(arr)) throw new Error('not array');
        const rows = [];
        let skipped = 0;
        const seen = new Set(records.map(sig));
        arr.forEach(item => {
          if (!item || typeof item !== 'object') return;
          const company = (item.company || '').toString().trim();
          const position = (item.position || '').toString().trim();
          if (!company && !position) return;
          const s = sig({ company, position, date: item.date, progress: item.progress });
          if (seen.has(s)) { skipped++; return; }
          seen.add(s);
          rows.push({
            user_id: currentUserId,
            date: item.date || todayStr(),
            company,
            position,
            progress: item.progress || '已投递',
            rejected: !!item.rejected,
            knowledge: Array.isArray(item.knowledge) ? item.knowledge : [],
            knowledge_done: Array.isArray(item.knowledgeDone) ? item.knowledgeDone : []
          });
        });
        if (rows.length === 0) { alert('没有可导入的新数据（可能都已存在）。'); return; }
        const { error } = await supabase.from('records').insert(rows);
        if (error) { alert('导入失败：' + error.message); return; }
        await loadRecords();
        alert('导入完成：新增 ' + rows.length + ' 条' + (skipped ? '，跳过重复 ' + skipped + ' 条' : '') + '。');
      } catch (e) {
        alert('导入失败：文件格式不正确。');
      }
    };
    reader.readAsText(file);
  }

  // ---------- 分组 ----------
  function groupPriority(name) {
    return name in PROGRESS_PRIORITY ? PROGRESS_PRIORITY[name] : 999;
  }
  function groupedRecords() {
    const active = [];
    const rejected = [];
    records.forEach(r => (r.rejected ? rejected : active).push(r));

    const map = new Map();
    active.forEach(r => {
      const key = r.progress || '未设置';
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(r);
    });
    const groups = [...map.entries()].map(([name, items]) => ({ name, items, rejected: false }));
    groups.sort((a, b) => {
      const pa = groupPriority(a.name), pb = groupPriority(b.name);
      if (pa !== pb) return pa - pb;
      return a.name.localeCompare(b.name, 'zh');
    });

    if (rejected.length > 0) {
      rejected.sort((a, b) => {
        const pa = groupPriority(a.progress || '未设置');
        const pb = groupPriority(b.progress || '未设置');
        if (pa !== pb) return pa - pb;
        return (a.progress || '').localeCompare(b.progress || '', 'zh');
      });
      groups.push({ name: '落选', items: rejected, rejected: true });
    }

    return groups;
  }

  // ---------- 渲染 ----------
  function render() {
    const groups = groupedRecords();
    const allProgress = collectProgressOptions();

    updateDatalist(allProgress);
    updateStats();

    const listEl = $('#list');
    const emptyEl = $('#empty');
    if (records.length === 0) {
      listEl.innerHTML = '';
      emptyEl.hidden = false;
      return;
    }
    emptyEl.hidden = true;

    listEl.innerHTML = '';
    groups.forEach(g => {
      const section = document.createElement('section');
      section.className = 'group' + (g.rejected ? ' rejected-group' : '');

      const head = document.createElement('div');
      head.className = 'group-head';
      head.innerHTML =
        '<span class="group-title"></span>' +
        '<span class="group-count"></span>';
      head.querySelector('.group-title').textContent = g.name;
      head.querySelector('.group-count').textContent = g.items.length + ' 个';
      section.appendChild(head);

      g.items.forEach(r => section.appendChild(buildCard(r, allProgress)));
      listEl.appendChild(section);
    });
  }

  function buildCard(r, allProgress) {
    const card = document.createElement('div');
    card.className = 'card' + (r.rejected ? ' rejected' : '');
    card.dataset.id = r.id;

    const row = document.createElement('div');
    row.className = 'card-row';

    const rejectLabel = document.createElement('label');
    rejectLabel.className = 'reject-toggle';
    rejectLabel.title = '勾选后划掉（落选）';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!r.rejected;
    cb.addEventListener('change', async () => { await updateRecord(r.id, { rejected: cb.checked }); });
    rejectLabel.appendChild(cb);
    rejectLabel.appendChild(document.createTextNode('落选'));

    const main = document.createElement('div');
    main.className = 'card-main';
    main.innerHTML =
      '<div class="card-title"><span class="company"></span>' +
      '<span class="pos-sep">·</span><span class="position"></span></div>' +
      '<div class="card-meta"><span class="card-date"></span>' +
      '<span class="tag"></span><span class="hint-learn"></span></div>';
    main.querySelector('.company').textContent = r.company;
    main.querySelector('.position').textContent = r.position;
    main.querySelector('.card-date').textContent = fmtDate(r.date);
    main.querySelector('.tag').textContent = r.progress || '未设置';
    main.querySelector('.hint-learn').textContent =
      (r.knowledge || []).length ? '知识点 ' + r.knowledge.length + ' 个' : '点击填写知识点';
    main.addEventListener('click', () => {
      expandedId = expandedId === r.id ? null : r.id;
      render();
    });

    const actions = document.createElement('div');
    actions.className = 'card-actions';

    const sel = document.createElement('select');
    sel.className = 'progress-select';
    sel.title = '修改进展';
    allProgress.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p;
      opt.textContent = p;
      sel.appendChild(opt);
    });
    sel.value = r.progress || '未设置';
    sel.addEventListener('change', async () => { await updateRecord(r.id, { progress: sel.value }); });

    const editBtn = document.createElement('button');
    editBtn.className = 'icon-btn';
    editBtn.title = '编辑公司 / 岗位 / 日期';
    editBtn.textContent = '✎';
    editBtn.addEventListener('click', () => openEdit(r));

    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn del';
    delBtn.title = '删除';
    delBtn.textContent = '×';
    delBtn.addEventListener('click', async () => {
      if (confirm('确定删除「' + r.company + ' · ' + r.position + '」吗？')) {
        await deleteRecord(r.id);
      }
    });

    actions.appendChild(sel);
    actions.appendChild(editBtn);
    actions.appendChild(delBtn);

    row.appendChild(rejectLabel);
    row.appendChild(main);
    row.appendChild(actions);
    card.appendChild(row);

    if (expandedId === r.id) {
      card.appendChild(buildKnowledgePanel(r));
    }

    return card;
  }

  function buildKnowledgePanel(r) {
    const kp = (r.knowledge = r.knowledge || []);
    const panel = document.createElement('div');
    panel.className = 'knowledge-panel';

    const head = document.createElement('div');
    head.className = 'kp-head';
    head.textContent = '需要学习的知识点';
    panel.appendChild(head);

    const list = document.createElement('ul');
    list.className = 'kp-list';
    if (kp.length === 0) {
      const li = document.createElement('li');
      li.className = 'kp-item';
      li.style.color = 'var(--faint)';
      li.style.fontSize = '13px';
      li.textContent = '暂无知识点';
      list.appendChild(li);
    } else {
      kp.forEach((text, i) => {
        const li = document.createElement('li');
        li.className = 'kp-item' + (r.knowledgeDone && r.knowledgeDone[i] ? ' done' : '');
        const c = document.createElement('input');
        c.type = 'checkbox';
        c.checked = !!(r.knowledgeDone && r.knowledgeDone[i]);
        c.addEventListener('change', async () => {
          r.knowledgeDone = r.knowledgeDone || [];
          r.knowledgeDone[i] = c.checked;
          await updateRecord(r.id, { knowledge_done: r.knowledgeDone || [] });
        });
        const span = document.createElement('span');
        span.className = 'kp-text';
        span.textContent = text;
        const del = document.createElement('button');
        del.className = 'kp-del';
        del.title = '删除';
        del.textContent = '×';
        del.addEventListener('click', async () => {
          kp.splice(i, 1);
          if (r.knowledgeDone) r.knowledgeDone.splice(i, 1);
          await updateRecord(r.id, { knowledge: kp, knowledge_done: r.knowledgeDone || [] });
        });
        li.appendChild(c);
        li.appendChild(span);
        li.appendChild(del);
        list.appendChild(li);
      });
    }
    panel.appendChild(list);

    const addWrap = document.createElement('div');
    addWrap.className = 'kp-add';
    const input = document.createElement('input');
    input.placeholder = '输入知识点，如：React Hooks';
    const addBtn = document.createElement('button');
    addBtn.className = 'btn-sm';
    addBtn.textContent = '添加';
    const doAdd = async () => {
      const v = input.value.trim();
      if (!v) return;
      kp.push(v);
      if (r.knowledgeDone) r.knowledgeDone.push(false);
      await updateRecord(r.id, { knowledge: kp, knowledge_done: r.knowledgeDone || [] });
    };
    addBtn.addEventListener('click', doAdd);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doAdd(); } });
    addWrap.appendChild(input);
    addWrap.appendChild(addBtn);
    panel.appendChild(addWrap);

    return panel;
  }

  // ---------- 进展选项 ----------
  function collectProgressOptions() {
    const set = new Set(DEFAULT_PROGRESS);
    records.forEach(r => { if (r.progress) set.add(r.progress); });
    return [...set];
  }
  function updateDatalist(opts) {
    const dl = $('#progress-options');
    dl.innerHTML = '';
    opts.forEach(p => {
      const o = document.createElement('option');
      o.value = p;
      dl.appendChild(o);
    });
  }
  function updateStats() {
    $('#stat-total').textContent = records.length;
    $('#stat-rejected').textContent = records.filter(r => r.rejected).length;
    $('#stat-active').textContent = records.filter(r => !r.rejected).length;
  }

  // ---------- 添加 ----------
  const addForm = $('#add-form');
  addForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const company = $('#f-company').value.trim();
    const position = $('#f-position').value.trim();
    const progress = $('#f-progress').value.trim() || '已投递';
    const date = $('#f-date').value || todayStr();
    if (!company || !position) return;
    const rec = await insertRecord({
      user_id: currentUserId, date, company, position, progress,
      rejected: false, knowledge: [], knowledge_done: []
    });
    if (!rec) return;
    records.push(rec);
    $('#f-company').value = '';
    $('#f-position').value = '';
    $('#f-progress').value = progress;
    $('#f-company').focus();
    render();
  });

  // ---------- 编辑弹窗 ----------
  const modal = $('#modal');
  function openEdit(r) {
    editingId = r.id;
    $('#e-company').value = r.company;
    $('#e-position').value = r.position;
    $('#e-date').value = r.date || todayStr();
    modal.hidden = false;
    $('#e-company').focus();
  }
  $('#modal-cancel').addEventListener('click', () => { modal.hidden = true; editingId = null; });
  $('#modal-save').addEventListener('click', async () => {
    const r = records.find(x => x.id === editingId);
    if (r) {
      await updateRecord(r.id, {
        company: $('#e-company').value.trim() || r.company,
        position: $('#e-position').value.trim() || r.position,
        date: $('#e-date').value || r.date
      });
    }
    modal.hidden = true;
    editingId = null;
  });
  modal.addEventListener('click', (e) => {
    if (e.target === modal) { modal.hidden = true; editingId = null; }
  });

  // ---------- 事件绑定 ----------
  $('#btn-export').addEventListener('click', exportJSON);
  $('#btn-import').addEventListener('click', () => $('#file-import').click());
  $('#btn-refresh').addEventListener('click', () => loadRecords());
  $('#file-import').addEventListener('change', () => {
    const file = $('#file-import').files[0];
    if (file) importJSON(file);
    $('#file-import').value = '';
  });
  $('#btn-theme').addEventListener('click', () => {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  $('#btn-logout').addEventListener('click', async () => { await supabase.auth.signOut(); });

  // 登录 / 注册
  const authForm = $('#auth-form');
  $('#a-toggle').addEventListener('click', () => {
    authMode = authMode === 'login' ? 'signup' : 'login';
    $('#a-submit').textContent = authMode === 'login' ? '登录' : '注册';
    $('#a-mode-text').textContent = authMode === 'login' ? '还没有账号？' : '已有账号？';
    $('#a-toggle').textContent = authMode === 'login' ? '去注册' : '去登录';
  });
  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('#a-email').value.trim();
    const password = $('#a-password').value;
    if (!email || !password) { setAuthMsg('请输入邮箱和密码'); return; }
    $('#a-submit').disabled = true;
    setAuthMsg('');
    const res = authMode === 'login'
      ? await supabase.auth.signInWithPassword({ email, password })
      : await supabase.auth.signUp({ email, password });
    $('#a-submit').disabled = false;
    if (res.error) {
      setAuthMsg((authMode === 'login' ? '登录失败：' : '注册失败：') + res.error.message);
      return;
    }
    if (authMode === 'signup' && !res.data.session) {
      setAuthMsg('注册成功，请到邮箱点击确认链接后登录。', true);
    }
    // 其余情况由 onAuthStateChange 触发进入应用
  });

  // 忘记密码
  $('#a-forgot').addEventListener('click', () => { setAuthMsg(''); showAuthPanel('forgot'); });
  $('#forgot-back').addEventListener('click', () => { setAuthMsg(''); showAuthPanel('auth'); });
  $('#forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('#f-email').value.trim();
    if (!email) { setAuthMsg('请输入邮箱'); return; }
    const btn = e.target.querySelector('.btn');
    btn.disabled = true;
    setAuthMsg('');
    const redirectTo = window.location.origin + window.location.pathname;
    const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo });
    btn.disabled = false;
    if (error) { setAuthMsg('发送失败：' + error.message); }
    else { setAuthMsg('重置邮件已发送，请查收邮箱。', true); }
  });
  $('#reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const p1 = $('#r-password').value;
    const p2 = $('#r-password2').value;
    if (p1.length < 6) { setAuthMsg('密码至少 6 位'); return; }
    if (p1 !== p2) { setAuthMsg('两次输入的密码不一致'); return; }
    const { error } = await supabase.auth.updateUser({ password: p1 });
    if (error) { setAuthMsg('重置失败：' + error.message); }
    else {
      setAuthMsg('密码已重置，请重新登录。', true);
      showAuthPanel('auth');
    }
  });

  // ---------- 初始化 ----------
  applyTheme(currentTheme());
  $('#f-date').value = todayStr();

  const configured = SUPABASE_URL && SUPABASE_URL.indexOf('YOUR_') === -1 &&
                     SUPABASE_ANON_KEY && SUPABASE_ANON_KEY.indexOf('YOUR_') === -1;
  if (!configured) {
    $('#auth-view').hidden = false;
    $('#auth-form').hidden = true;
    document.querySelector('.auth-switch').hidden = true;
    setAuthMsg('尚未配置云端连接，请先完成 Supabase 设置（见 SETUP.md）。');
    return;
  }

  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      $('#auth-view').hidden = false;
      $('#app-view').hidden = true;
      setAuthMsg('');
      showAuthPanel('reset');
    } else if (session) {
      enterApp();
    } else {
      showAuth();
    }
  });

  // 页面加载时判断是否已登录
  (async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) { await enterApp(); }
    else { showAuth(); }
  })();
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./service-worker.js').catch(function () {});
    });
  }
</script>
</body>
